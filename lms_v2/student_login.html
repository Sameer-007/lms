<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LMS Portal - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --admin-color: #7c3aed;
      --admin-hover: #6d28d9;
      --admin-light: #f5f3ff;
      --surface: #ffffff;
      --background: #f8fafc;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
      --danger: #ef4444;
      --success: #10b981;
      --radius: 18px;
      --shadow: 0 20px 25px -5px rgb(0 0 0 / 0.06), 0 8px 10px -6px rgb(0 0 0 / 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #f1f5f9 0%, #e2e8f0 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-container {
      width: 100%;
      max-width: 450px;
      background: var(--surface);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 38px 32px;
      position: relative;
      overflow: hidden;
    }

    .top-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #2563eb, #3b82f6, #8b5cf6);
      transition: background 0.3s ease;
    }

    .login-container.admin-mode .top-accent-bar {
      background: linear-gradient(90deg, #7c3aed, #a855f7, #ec4899);
    }

    .login-container.teacher-mode .top-accent-bar {
      background: linear-gradient(90deg, #059669, #10b981, #14b8a6);
    }

    .brand-header {
      text-align: center;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 58px;
      height: 58px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      box-shadow: 0 6px 14px rgba(37, 99, 235, 0.15);
      transition: all 0.3s ease;
    }

    .login-container.admin-mode .brand-logo {
      background: var(--admin-light);
      color: var(--admin-color);
      box-shadow: 0 6px 14px rgba(124, 58, 237, 0.15);
    }

    .login-container.teacher-mode .brand-logo {
      background: #ecfdf5;
      color: #059669;
      box-shadow: 0 6px 14px rgba(16, 185, 129, 0.15);
    }

    .login-container.teacher-mode input:focus {
      border-color: #059669;
      box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.14);
    }

    .login-container.teacher-mode .btn-submit {
      background: #059669;
    }

    .login-container.teacher-mode .btn-submit:hover {
      background: #047857;
    }

    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 6px;
    }

    p.subtitle {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }

    /* Role Tabs */
    .role-tabs {
      display: flex;
      background: #f1f5f9;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 24px;
      border: 1px solid var(--border);
    }

    .role-tab {
      flex: 1;
      padding: 9px 0;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      background: transparent;
      border: none;
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .role-tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }

    .role-tab.active.student-active {
      color: var(--primary);
    }

    .role-tab.active.teacher-active {
      color: #059669;
    }

    .role-tab.active.admin-active {
      color: var(--admin-color);
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
      margin-bottom: 7px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 16px;
      pointer-events: none;
    }

    input[type="tel"], input[type="password"], input[type="number"], input[type="text"] {
      width: 100%;
      height: 48px;
      padding: 0 16px 0 44px;
      font-size: 14.5px;
      font-family: inherit;
      color: var(--text);
      background: #f8fafc;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .login-container.admin-mode input:focus {
      border-color: var(--admin-color);
      box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.12);
    }

    .btn-submit {
      width: 100%;
      height: 50px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      margin-top: 10px;
    }

    .btn-submit:hover:not(:disabled) {
      background: var(--primary-hover);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
    }

    .login-container.admin-mode .btn-submit {
      background: var(--admin-color);
      box-shadow: 0 4px 12px rgba(124, 58, 237, 0.25);
    }

    .login-container.admin-mode .btn-submit:hover:not(:disabled) {
      background: var(--admin-hover);
      box-shadow: 0 6px 16px rgba(124, 58, 237, 0.35);
    }

    .btn-submit:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .alert {
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      animation: fadeIn 0.3s ease;
    }

    .alert-danger {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #b91c1c;
    }

    .alert-success {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      color: #047857;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2.5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    /* Fallback / Quick Access */
    .quick-switch {
      margin-top: 22px;
      text-align: center;
      font-size: 12.5px;
      color: var(--muted);
    }

    .quick-switch a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-switch a:hover {
      text-decoration: underline;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="login-container" id="loginBox">
    <div class="top-accent-bar"></div>

    <div class="brand-header">
      <div class="brand-logo" id="brandLogoIcon">🎓</div>
      <h1 id="portalTitle">Student Login</h1>
      <p class="subtitle" id="portalSubtitle">Sign in with your registered phone number & password</p>
    </div>

    <!-- Role Switch Tabs -->
    <div class="role-tabs">
      <button type="button" class="role-tab active student-active" id="tabStudent" onclick="switchRole('student')">
        <span>🎓</span> Student
      </button>
      <button type="button" class="role-tab" id="tabTeacher" onclick="switchRole('teacher')">
        <span>👨‍🏫</span> Teacher
      </button>
      <button type="button" class="role-tab" id="tabAdmin" onclick="switchRole('admin')">
        <span>👑</span> Admin
      </button>
    </div>

    <div id="alertBox" class="alert"></div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group" id="phoneGroup">
        <label for="phone">Phone Number</label>
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="phone" name="phone" placeholder="e.g. 9876543210" required autofocus>
        </div>
      </div>

      <div class="form-group" id="passwordGroup">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <span class="input-icon">🔒</span>
          <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submitBtn">
        <span class="btn-text" id="btnLabel">Sign In &rarr;</span>
        <div class="spinner" id="btnSpinner"></div>
      </button>
    </form>

    <div class="quick-switch" id="devQuickAccess">
      <span>Need fast testing?</span><br>
      <a onclick="quickStudentLogin(1)">Student (DVS)</a> | 
      <a onclick="quickTeacherLogin(1)">Teacher (Sekhar)</a> | 
      <a onclick="quickAdminLogin()">Admin</a>
    </div>
  </div>

  <script>
    let currentRole = 'student';

    const loginBox = document.getElementById('loginBox');
    const tabStudent = document.getElementById('tabStudent');
    const tabTeacher = document.getElementById('tabTeacher');
    const tabAdmin = document.getElementById('tabAdmin');
    const brandLogoIcon = document.getElementById('brandLogoIcon');
    const portalTitle = document.getElementById('portalTitle');
    const portalSubtitle = document.getElementById('portalSubtitle');
    const btnLabel = document.getElementById('btnLabel');
    const phoneInput = document.getElementById('phone');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const btnSpinner = document.getElementById('btnSpinner');
    const alertBox = document.getElementById('alertBox');

    function switchRole(role) {
      currentRole = role;
      hideAlert();

      loginBox.classList.remove('admin-mode', 'teacher-mode');
      tabStudent.className = 'role-tab';
      tabTeacher.className = 'role-tab';
      tabAdmin.className = 'role-tab';

      if (role === 'admin') {
        loginBox.classList.add('admin-mode');
        tabAdmin.className = 'role-tab active admin-active';
        brandLogoIcon.textContent = '👑';
        portalTitle.textContent = 'Admin Login';
        portalSubtitle.textContent = 'Sign in to access root library and LMS management';
        btnLabel.textContent = 'Sign In as Admin →';
      } else if (role === 'teacher') {
        loginBox.classList.add('teacher-mode');
        tabTeacher.className = 'role-tab active teacher-active';
        brandLogoIcon.textContent = '👨‍🏫';
        portalTitle.textContent = 'Teacher Login';
        portalSubtitle.textContent = 'Sign in to access faculty materials and courses';
        btnLabel.textContent = 'Sign In as Teacher →';
      } else {
        tabStudent.className = 'role-tab active student-active';
        brandLogoIcon.textContent = '🎓';
        portalTitle.textContent = 'Student Login';
        portalSubtitle.textContent = 'Sign in with your registered phone number & password';
        btnLabel.textContent = 'Sign In as Student →';
      }

      phoneInput.focus();
    }

    function showAlert(message, type = 'danger') {
      alertBox.textContent = message;
      alertBox.className = `alert alert-${type}`;
      alertBox.style.display = 'block';
    }

    function hideAlert() {
      alertBox.style.display = 'none';
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      btnSpinner.style.display = isLoading ? 'block' : 'none';
      btnLabel.style.display = isLoading ? 'none' : 'inline';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();

      const phone = phoneInput.value.trim();
      const password = passwordInput.value.trim();

      if (!phone || !password) {
        showAlert('Please enter both phone number and password.');
        return;
      }

      setLoading(true);

      // Determine the API endpoint based on role
      let endpoint = 'api/auth/student_login.php';
      if (currentRole === 'admin') {
        endpoint = 'api/auth/admin_login.php';
      } else if (currentRole === 'teacher') {
        endpoint = 'api/auth/teacher_login.php';
      }

      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ phone, password })
        });

        const rawText = await response.text();
        let data;
        try {
          const jsonStart = rawText.indexOf('{');
          const jsonEnd = rawText.lastIndexOf('}');
          if (jsonStart !== -1 && jsonEnd !== -1) {
            data = JSON.parse(rawText.slice(jsonStart, jsonEnd + 1));
          } else {
            data = JSON.parse(rawText);
          }
        } catch (parseErr) {
          console.error("Non-JSON response:", rawText);
          const cleanMsg = rawText.replace(/<[^>]*>?/gm, ' ').replace(/\s+/g, ' ').trim();
          throw new Error(cleanMsg || 'Server returned an invalid response.');
        }

        if (!response.ok || data.success === false) {
          throw new Error(data.message || 'Login failed. Please check your credentials.');
        }

        // Successfully authenticated!
        const user = data.user || {};
        const defaultName = currentRole === 'admin' 
          ? 'Administrator' 
          : (currentRole === 'teacher' ? `Teacher #${user.id}` : `Student #${user.id}`);

        const authData = {
          token: data.token || '',
          role: currentRole, // 'student', 'teacher', or 'admin'
          user: {
            id: user.id || 0,
            name: user.name || defaultName,
            phone: user.phone || phone,
            role: currentRole,
            class: user.class || null
          },
          login_time: new Date().toISOString()
        };

        // Store auth token and session
        localStorage.setItem('lms_auth', JSON.stringify(authData));
        localStorage.setItem('lms_student', JSON.stringify(authData.user));

        showAlert(`Welcome, ${authData.user.name}! Redirecting to portal...`, 'success');

        setTimeout(() => {
          window.location.href = 'student_portal.html';
        }, 600);

      } catch (err) {
        showAlert(err.message || 'Unable to connect to the authentication server.');
      } finally {
        setLoading(false);
      }
    });

    // Quick test bypass for rapid verification
    function quickStudentLogin(studentId = 1) {
      const authData = {
        token: 'dev-mock-student-token',
        role: 'student',
        user: {
          id: studentId,
          name: `Student #${studentId}`,
          role: 'student'
        },
        login_time: new Date().toISOString()
      };
      localStorage.setItem('lms_auth', JSON.stringify(authData));
      localStorage.setItem('lms_student', JSON.stringify(authData.user));
      window.location.href = 'student_portal.html';
    }

    function quickTeacherLogin(teacherId = 1) {
      const authData = {
        token: 'dev-mock-teacher-token',
        role: 'teacher',
        user: {
          id: teacherId,
          name: 'Sekhar (Faculty)',
          role: 'teacher'
        },
        login_time: new Date().toISOString()
      };
      localStorage.setItem('lms_auth', JSON.stringify(authData));
      localStorage.setItem('lms_student', JSON.stringify(authData.user));
      window.location.href = 'student_portal.html';
    }

    function quickAdminLogin() {
      const authData = {
        token: 'dev-mock-admin-token',
        role: 'admin',
        user: {
          id: 1,
          name: 'Super Admin',
          role: 'admin'
        },
        login_time: new Date().toISOString()
      };
      localStorage.setItem('lms_auth', JSON.stringify(authData));
      localStorage.setItem('lms_student', JSON.stringify(authData.user));
      window.location.href = 'student_portal.html';
    }
  </script>
</body>
</html>
